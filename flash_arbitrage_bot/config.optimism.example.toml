# ---- DEXes --------------------------------------------------------------------------
# "solidly" = Velodrome V2 (Optimism's largest DEX; Aerodrome is its Base copy):
# volatile pools only, fee read from the factory. Velodrome's concentrated
# "Slipstream" pools aren't supported yet. A DEX that finds 0 pools at startup
# has a wrong address: check it on the explorer.
[dexes.uniswap_v3]
type = "v3"
factory = "0x1F98431c8aD98523631AE4a59f267346ea31F984"
router = "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45"
