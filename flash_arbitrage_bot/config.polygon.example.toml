max_loan_usd = 25000.0
min_pool_liquidity_usd = 10000.0
min_pool_reserve_usd = 2500.0
max_gas_price_gwei = 500.0      # Polygon's base fee is usually tens of gwei and spikes into the hundreds
max_daily_gas_usd = 5.0
max_consecutive_reverts = 3

[discovery]
enabled = true
min_liquidity_usd = 10000.0
max_tokens = 250
max_pairs_per_factory = 30000
cache_hours = 24
cache_file = "logs_polygon/discovered_tokens.json"
