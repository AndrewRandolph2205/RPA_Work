[risk]
min_profit_usd = 0.10           # paper trading showed gaps under $0.10 lose money overall (lost bids)
max_loan_usd = 25000.0
min_pool_liquidity_usd = 10000.0
min_pool_reserve_usd = 2500.0
max_gas_price_gwei = 500.0      # Polygon's base fee is usually tens of gwei and spikes into the hundreds
max_daily_gas_usd = 5.0
max_consecutive_reverts = 3

[discovery]
enabled = true
min_liquidity_usd = 10000.0
max_tokens = 250
max_pairs_per_factory = 150000   # all of QuickSwap V2's ~136k pairs: established tokens sit in the older ones
active_pool_blocks = 1800       # also find tokens from the V3 pools that traded in the last ~hour
cache_hours = 24
cache_file = "logs_polygon/discovered_tokens.json"
