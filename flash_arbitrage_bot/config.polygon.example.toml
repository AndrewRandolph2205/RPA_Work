# Polygon PoS. Copy to config.polygon.toml and run with:
#   python run_flash.py run --config config.polygon.toml
#
# How Polygon differs from Arbitrum, and what that means here:
# - Blocks every ~2s from rotating validators, not a single sequencer. Short
#   reorgs happen; the pool-event stream notices them and re-reads the pools.
# - A PUBLIC MEMPOOL: a transaction is visible to everyone before it's in a
#   block. Other bots can copy a profitable trade and bid a higher priority
#   fee to go first. Because every trade is a flash loan that reverts unless it
#   profits, that costs only the reverted transaction's gas (a fraction of a
#   cent here), never the borrowed money. send_rpc_url can point at a private
#   transaction relay to keep trades out of the public mempool.
# - Validators order by priority fee (ordering = "fee"), and drop transactions
#   that tip less than ~25-30 gwei (min_priority_fee_gwei).
# - Gas is paid in POL, so the gas token is WPOL (formerly WMATIC).
# - No sequencer feed: blocks are announced by the node's own newHeads over the
#   same websocket that streams the pool events.
#
# Start in scan mode for a day (free), then paper mode, before deploying.
# Needs POLYGON_RPC_URL in .env, e.g. https://polygon-mainnet.g.alchemy.com/v2/<key>
# (enable Polygon PoS for the key in Alchemy's dashboard).
mode = "scan"

# ---- Network: Polygon PoS -----------------------------------------------------------
# Addresses from memory: `python run_flash.py selftest --config config.polygon.toml`
# checks every factory and router holds a contract, and startup skips any token
# that doesn't answer. Double-check on https://polygonscan.com before going live.
chain_name = "polygon"
chain_id = 137
rpc_url_env = "POLYGON_RPC_URL"      # separate from the other chains' URLs, so all configs work side by side
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"   # Balancer V2, same address as on Arbitrum
contract_address = ""
owner_address = ""

# ---- Bot behaviour ----------------------------------------------------------------
max_hops = 3
poll_interval_s = 0.25
max_candidates_per_block = 3
sim_cooldown_blocks = 5
gas_units_estimate = 450000
route_rebuild_s = 3600
summary_interval_s = 60
log_dir = "logs_polygon"

# ---- Speed and ordering -------------------------------------------------------------
sequencer_feed_url = ""         # none on Polygon
state_source = "logs"           # pool events + newHeads over one websocket
ws_rpc_url_env = "POLYGON_WS_RPC_URL"   # unset = POLYGON_RPC_URL with https:// -> wss://
logs_settle_ms = 150
logs_resync_s = 60
exact_sim = true
trace_closers = true
ordering = "fee"                # validators put the highest priority fee first
priority_fee_share = 0.5        # bid half of each trade's expected profit above min_profit_usd...
min_priority_fee_gwei = 30      # ...but never less than the network's minimum tip
extra_tx_cost_usd = 0.0         # no L1 data fee on Polygon PoS
send_rpc_url = ""               # a private transaction relay here keeps live trades out of the public mempool
presimulate_live = true         # exact check before sending: a revert here still pays the whole bid; 2s blocks leave time
live_gas_limit = 2000000
paper_send_latency_ms = 50
paper_timeboost = "off"         # Timeboost is Arbitrum-only
paper_timeboost_delay_ms = 0
paper_block_time_ms = 2000
paper_same_block_wins = false   # with ordering = "fee" the bids decide instead
paper_gas_units = 0

# ---- Tokens -----------------------------------------------------------------------
native_wrapped = "WPOL"
stable_tokens = ["USDC", "USDC.e", "USDT", "DAI"]
flash_tokens = ["WETH", "USDC", "USDC.e", "WPOL"]   # whatever Balancer's vault holds; startup logs how much

