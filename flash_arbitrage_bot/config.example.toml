# Copy to config.toml (git-ignored) and edit.
#
# mode:
#   "scan"     - read pools every block and log opportunities the math finds.
#                Needs only RPC_URL. No contract, no wallet, no cost.
#   "simulate" - also run each opportunity through the deployed contract with
#                eth_call (a free, exact dry run). Never sends anything.
#   "live"     - send real transactions. Also requires the --live flag.
mode = "scan"

# ---- Network: Arbitrum One ------------------------------------------------
# Arbitrum: cheap gas, and its sequencer has no public mempool, so other bots
# can't front-run or sandwich your transactions.
# Verify every address below on https://arbiscan.io before going live;
# `python run_flash.py selftest` checks they all hold contracts.
chain_name = "arbitrum"
chain_id = 42161
rpc_url_env = "RPC_URL"

# Balancer V2 vault: flash loans with no fee (same address on every chain).
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"

# Filled in after `python run_flash.py deploy`.
contract_address = ""
# For simulate mode without a PRIVATE_KEY: the wallet that deployed the contract.
owner_address = ""

# ---- Bot behaviour ----------------------------------------------------------
max_hops = 3                    # 2 = A->B->A, 3 adds triangles A->B->C->A
poll_interval_s = 0.25          # Arbitrum makes a block roughly every 0.25s
max_candidates_per_block = 3    # how many top opportunities to simulate per block
sim_cooldown_blocks = 20        # after a failed simulation, skip that route this many blocks
gas_units_estimate = 450000     # for pre-screening; real gas comes from simulation
route_rebuild_s = 3600          # re-check which pools are liquid enough, hourly
summary_interval_s = 60
log_dir = "logs"

# ---- Tokens -----------------------------------------------------------------
native_wrapped = "WETH"                              # gas token, for gas-cost math
stable_tokens = ["USDC", "USDC.e", "USDT", "DAI"]    # treated as $1 for valuation
flash_tokens = ["WETH", "USDC", "USDT"]              # tokens the bot may borrow

# At startup the bot asks each token for its decimals and symbol: addresses that
# aren't tokens are skipped with a warning, and a symbol that doesn't match the
# name here is flagged so you can double-check it on arbiscan.io.
