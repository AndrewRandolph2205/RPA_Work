[risk]
min_profit_usd = 0.50           # after gas; also enforced on-chain by the contract
max_loan_usd = 25000.0          # largest flash loan per trade
min_pool_liquidity_usd = 25000.0  # ignore thin pools (they produce fake "opportunities")
max_gas_price_gwei = 1.0        # skip blocks when gas spikes
max_daily_gas_usd = 5.0         # stop sending after burning this much gas on reverts in a day
max_consecutive_reverts = 3     # halt the bot after this many reverts in a row
