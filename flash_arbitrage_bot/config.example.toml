# ---- DEXes ------------------------------------------------------------------
# type:        "v2"         Uniswap V2 style pairs (fixed fee)
#              "v3"         Uniswap V3 style pools (one pool per fee tier)
#              "camelot_v2" Camelot V2 pairs (fee per direction, read every block;
#                           "stable" pairs are skipped automatically)
#              "algebra"    Camelot V3 / Algebra pools (one per pair, dynamic fees)
# router_kind: "v2", "v3_router02" (Uniswap SwapRouter02, no deadline field),
#              "v3_router" (original Uniswap V3 SwapRouter, with deadline),
#              "camelot_v2" or "algebra"
# quoter:      concentrated-liquidity dexes only; used to price candidates exactly
[dexes.uniswap_v3]
type = "v3"
factory = "0x1F98431c8aD98523631AE4a59f267346ea31F984"
router = "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45"
router_kind = "v3_router02"
fee_tiers = [100, 500, 3000, 10000]
quoter = "0x61fFE014bA17989E743c5F6cB21bF9697530B21e"   # QuoterV2: exact prices for scan mode

[dexes.sushiswap]
type = "v2"
factory = "0xc35DADB65012eC5796536bD9864eD8773aBc74C4"
router = "0x1b02dA8Cb0d097eB8D57A175b88c7D8b47997506"
router_kind = "v2"
fee = 3000

[dexes.uniswap_v2]
