# Base (Coinbase's OP-stack chain). Copy to config.base.toml and run with:
#   python run_flash.py run --config config.base.toml
#
# How Base differs from Arbitrum, and what that means here:
# - Blocks every 2s, not 0.25s.
# - Inside a block the sequencer orders transactions by priority fee, not by
#   arrival, so a trade is won by bidding, not by milliseconds (ordering = "fee").
#   Base also streams each block in 200ms "flashblocks": a competitor that arrives
#   a whole flashblock earlier can still land first whatever the fees, so paper
#   results on Base are an upper bound. The closers' positions and priority fees
#   (logs/closers.csv, paper_trades.csv) show what really decides the race.
# - Every transaction also pays a small L1 data fee (extra_tx_cost_usd).
# - No Arbitrum-style sequencer feed: blocks are announced by the node's own
#   newHeads over the same websocket that streams the pool events.
#
# Start in scan mode for a day: it's free, and the gap lifetimes and closers it
# records say whether Base is less crowded than Arbitrum before anything else.
# Needs BASE_RPC_URL in .env, e.g. https://base-mainnet.g.alchemy.com/v2/<key>
# (enable Base for the key in Alchemy's dashboard).
mode = "scan"

# ---- Network: Base ------------------------------------------------------------
# Addresses from memory: `python run_flash.py selftest --config config.base.toml`
# checks every factory and router holds a contract, and startup skips any token
# that doesn't answer. Double-check on https://basescan.org before going live.
chain_name = "base"
chain_id = 8453
rpc_url_env = "BASE_RPC_URL"         # separate from Arbitrum's RPC_URL, so both configs work side by side
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"   # Balancer V2, same address as on Arbitrum
contract_address = ""
owner_address = ""

# ---- Bot behaviour ----------------------------------------------------------------
max_hops = 3
poll_interval_s = 0.25
max_candidates_per_block = 3
sim_cooldown_blocks = 5         # blocks are 8x longer than Arbitrum's
gas_units_estimate = 450000
route_rebuild_s = 3600
summary_interval_s = 60
log_dir = "logs_base"           # kept apart from Arbitrum's results

# ---- Speed and ordering -------------------------------------------------------------
sequencer_feed_url = ""         # none on Base
state_source = "logs"           # pool events + newHeads over one websocket
ws_rpc_url_env = "BASE_WS_RPC_URL"   # unset = BASE_RPC_URL with https:// -> wss://
logs_settle_ms = 150            # Base nodes send a block's events well after its newHeads; blocks are 2s
logs_resync_s = 60
exact_sim = true
trace_closers = true
ordering = "fee"                # highest priority fee first within a block
priority_fee_share = 0.5        # bid half of each trade's expected profit above min_profit_usd
extra_tx_cost_usd = 0.005       # L1 data fee per transaction (a few tenths of a cent)
send_rpc_url = ""               # e.g. https://mainnet-sequencer.base.org to skip a hop (live mode)
presimulate_live = true         # exact check before sending: a revert here still pays the whole bid; 2s blocks leave time
live_gas_limit = 2000000
paper_send_latency_ms = 30
paper_timeboost = "off"         # Timeboost is Arbitrum-only
paper_timeboost_delay_ms = 0
paper_block_time_ms = 2000
paper_same_block_wins = false   # with ordering = "fee" the bids decide instead
paper_gas_units = 0

